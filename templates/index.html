<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClosetCraft - AI Fashion Recommendation & Outfit Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            padding: 2rem;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1rem;
            font-weight: bold;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            background-color: #f0f0ff;
            border-color: #764ba2;
        }
        
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .recommendation-card {
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .recommendation-card:hover {
            transform: translateY(-5px);
        }
        
        .similarity-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .wardrobe-item {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center text-white mb-4">👗 ClosetCraft</h1>
        <p class="text-center text-white mb-5">AI-Powered Fashion Recommendation & Outfit Generator</p>
        
        <!-- Recommendation Section -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">🔍 Find Similar Fashion Items</h5>
            </div>
            <div class="card-body">
                <form id="recommendForm" enctype="multipart/form-data">
                    <div class="upload-area" onclick="document.getElementById('recommendFile').click()">
                        <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                        <p>Click to upload a clothing image</p>
                        <input type="file" id="recommendFile" name="file" accept="image/*" style="display: none;" required>
                    </div>
                    <div id="recommendPreview" class="text-center mt-3"></div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Get Recommendations</button>
                </form>
                
                <div id="recommendLoading" class="loading">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Finding similar items...</p>
                </div>
                
                <div id="recommendResults" class="mt-4"></div>
            </div>
        </div>
        
        <!-- Outfit Generator Section -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">🎨 Generate Outfit from Your Wardrobe</h5>
            </div>
            <div class="card-body">
                <form id="outfitForm" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-3">
                            <label>Top/Shirt:</label>
                            <div class="upload-area-small" onclick="document.getElementById('topFile').click()">
                                <input type="file" id="topFile" name="top" accept="image/*" style="display: none;">
                                <div id="topPreview" class="preview-placeholder">+ Add Top</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Bottom/Pants:</label>
                            <div class="upload-area-small" onclick="document.getElementById('bottomFile').click()">
                                <input type="file" id="bottomFile" name="bottom" accept="image/*" style="display: none;">
                                <div id="bottomPreview" class="preview-placeholder">+ Add Bottom</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Shoes:</label>
                            <div class="upload-area-small" onclick="document.getElementById('shoesFile').click()">
                                <input type="file" id="shoesFile" name="shoes" accept="image/*" style="display: none;">
                                <div id="shoesPreview" class="preview-placeholder">+ Add Shoes</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Accessory (Optional):</label>
                            <div class="upload-area-small" onclick="document.getElementById('accessoryFile').click()">
                                <input type="file" id="accessoryFile" name="accessory" accept="image/*" style="display: none;">
                                <div id="accessoryPreview" class="preview-placeholder">+ Add Accessory</div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Generate Outfit</button>
                </form>
                
                <div id="outfitLoading" class="loading">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Creating your perfect outfit...</p>
                </div>
                
                <div id="outfitResults" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Image preview for recommendation
        $('#recommendFile').change(function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $('#recommendPreview').html(`<img src="${e.target.result}" class="image-preview" alt="Preview">`);
                }
                reader.readAsDataURL(file);
            }
        });
        
        // Image previews for outfit items
        function setupPreview(inputId, previewId) {
            $(`#${inputId}`).change(function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        $(`#${previewId}`).html(`<img src="${e.target.result}" class="image-preview" alt="Preview">`);
                    }
                    reader.readAsDataURL(file);
                }
            });
        }
        
        setupPreview('topFile', 'topPreview');
        setupPreview('bottomFile', 'bottomPreview');
        setupPreview('shoesFile', 'shoesPreview');
        setupPreview('accessoryFile', 'accessoryPreview');
        
        // Handle recommendation form submission
        $('#recommendForm').submit(function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            $('#recommendLoading').show();
            $('#recommendResults').hide();
            
            $.ajax({
                url: '/recommend',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    $('#recommendLoading').hide();
                    if (response.success) {
                        displayRecommendations(response);
                    } else {
                        $('#recommendResults').html(`<div class="alert alert-danger">${response.error}</div>`).show();
                    }
                },
                error: function(xhr) {
                    $('#recommendLoading').hide();
                    $('#recommendResults').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`).show();
                }
            });
        });
        
        function displayRecommendations(data) {
            let html = `<h6>Uploaded Image:</h6>
                       <img src="${data.uploaded_image}" class="image-preview" alt="Uploaded">
                       <h6 class="mt-4">Top 5 Similar Items:</h6>
                       <div class="row">`;
            
            data.recommendations.forEach(rec => {
                html += `
                    <div class="col-md-2 mb-3">
                        <div class="recommendation-card">
                            <img src="${rec.image_url}" class="img-fluid rounded" style="height: 150px; width: 100%; object-fit: cover;">
                            <div class="similarity-badge">${rec.similarity}% match</div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            $('#recommendResults').html(html).show();
        }
        
        // Handle outfit form submission
        $('#outfitForm').submit(function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            $('#outfitLoading').show();
            $('#outfitResults').hide();
            
            $.ajax({
                url: '/generate_outfit',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    $('#outfitLoading').hide();
                    if (response.success) {
                        displayOutfit(response);
                    } else {
                        $('#outfitResults').html(`<div class="alert alert-danger">${response.error}</div>`).show();
                    }
                },
                error: function(xhr) {
                    $('#outfitLoading').hide();
                    $('#outfitResults').html(`<div class="alert alert-danger">Error: ${xhr.responseJSON?.error || 'Something went wrong'}</div>`).show();
                }
            });
        });
        
        function displayOutfit(data) {
            let html = `<h6>Your Selected Items:</h6>
                       <div class="row mb-4">`;
            
            for (const [category, url] of Object.entries(data.items)) {
                html += `
                    <div class="col-md-3 text-center">
                        <img src="${url}" class="image-preview" style="width: 100%; height: 150px; object-fit: cover;">
                        <p class="mt-2"><strong>${category.toUpperCase()}</strong></p>
                    </div>
                `;
            }
            
            html += `</div>`;
            
            if (data.outfit.compatibility) {
                html += `<div class="alert alert-success">✨ ${data.outfit.compatibility}</div>`;
            }
            
            if (data.color_analysis && data.color_analysis.length > 0) {
                html += `<div class="alert alert-info">🎨 Color Analysis:<br>${data.color_analysis.join('<br>')}</div>`;
            }
            
            html += `<div class="text-center mt-3">
                        <button class="btn btn-success" onclick="location.reload()">Create Another Outfit</button>
                     </div>`;
            
            $('#outfitResults').html(html).show();
        }
    </script>
    
    <style>
        .upload-area-small {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-placeholder {
            color: #999;
            font-size: 14px;
        }
        
        .upload-area-small:hover {
            background-color: #f0f0ff;
        }
    </style>
</body>
</html>
